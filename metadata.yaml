name: astrbot_plugin_dafeiyu_xsg
display_name: 新三国梗（折棒系）
short_desc: 风从龙，云从虎，龙虎英雄傲苍穹。自家肥鱼用的新三国梗插件，聊梗、查梗都行。
desc: |
  只认 2010 年电视剧《新三国》（高希希执导）和 B 站 UP 主「吃蛋挞的折棒」《吐槽新三国》
  系列衍生的梗。内置 143 条。

  梗分三层，出处不混：
  · 原剧：剧中台词、名场面，能查到角色和集数
  · 折棒体系：折棒在吐槽里总结的机制，比如天意、窃听机制、曹氏兵法
  · 评论区：折棒系列评论区刷出来的固定说法

  你甩一句梗，她接得住；你问「这哪来的」，她分得清是原剧、折棒编的、还是评论区瞎刷的。
  不用打斜杠，说人话就行。

  原本只是给自家肥鱼用的，能聊梗也能答出处。至少我自己测下来没什么问题，
  你们用着有毛病就来说。
version: 1.0.0
author: dafeiyu
